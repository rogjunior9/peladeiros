# Docker Compose para Easypanel
# Este arquivo pode ser usado para deploy em um serviço tipo "Docker Compose"

version: '3.8'

services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: peladeiros-postgres
    environment:
      POSTGRES_USER: peladeiros
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peladeiros123}
      POSTGRES_DB: peladeiros
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peladeiros"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - peladeiros-network

  # Aplicação Next.js
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: peladeiros-app
    environment:
      # Database
      DATABASE_URL: postgresql://peladeiros:${DB_PASSWORD:-peladeiros123}@postgres:5432/peladeiros
      
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
      # PagSeguro
      PAGSEGURO_EMAIL: ${PAGSEGURO_EMAIL}
      PAGSEGURO_TOKEN: ${PAGSEGURO_TOKEN}
      PAGSEGURO_SANDBOX: ${PAGSEGURO_SANDBOX:-true}
      PAGSEGURO_NOTIFICATION_URL: ${PAGSEGURO_NOTIFICATION_URL}
      
      # Admin
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      
      # Cron
      CRON_SECRET: ${CRON_SECRET}
      
      # N8N
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_API_KEY: ${N8N_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - peladeiros-network

  # N8N (Automações)
  n8n:
    image: n8nio/n8n:latest
    container_name: peladeiros-n8n
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    restart: unless-stopped
    networks:
      - peladeiros-network

volumes:
  postgres_data:
  n8n_data:

networks:
  peladeiros-network:
    driver: bridge
